<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비기너 로또</title>
  <link rel="stylesheet" href="./css/style.css">
  </head>
<body>
  <div id="resultModal" class="modal flex">
    <div id="modalFrame" class="modalFrame flex">
      <div class="modalHeader">당첨 결과</div>
      <div class="flex listHeader">
        <div>일치 갯수</div>
        <div>당첨금</div>
        <div>당첨 갯수</div>
      </div>
      <div class="flex list">
        <div>3개</div>
        <div>5,000원</div>
        <div id="num3">n개</div>
      </div>
      <div class="flex list">
        <div>4개</div>
        <div>50,000원</div>
        <div id="num4">n개</div>
      </div>
      <div class="flex list">
        <div>5개</div>
        <div>150,000원</div>
        <div id="num5">n개</div>
      </div>
      <div class="flex list">
        <div>5개 + 보너스</div>
        <div>15,000,000원</div>
        <div id="num5b">n개</div>
      </div>
      <div class="flex list">
        <div>6개</div>
        <div>200,000,000원</div>
        <div id="num6">n개</div>
      </div>
      <div class="modalResult" id="total">당신의 당첨금은 총 xxxx원 입니다.</div>
      <button class="font" id="modalClose">닫기</button>
    </div>
  </div>
  <div class="Header flex">
    <div class="font">
      비기너 로또
    </div>
  </div>
  <div class="lotto flex">
    <div class="title flex">
      <h1 class="font">로또 번호 생성기</h1>
      <h2 class="font">행운의 번호를 생성해보세요!</h2>
    </div>
    <div class="text">
      당첨 번호 생성
    </div>
    <div class="frame flex">
      <div class="ball font flex" id="ball1">?</div>
      <div class="ball font flex" id="ball2">?</div>
      <div class="ball font flex" id="ball3">?</div>
      <div class="ball font flex" id="ball4">?</div>
      <div class="ball font flex" id="ball5">?</div>
      <div class="ball font flex" id="ball6">?</div>
      <div class="ball font flex" id="ball7">?
        <img class="star flex" src="./image/star.png" alt="star">
      </div>
    </div>
    <button id="createNum" class="font flex">번호 생성하기</button>
    <div class="lotto_buy flex text">
      로또 구매하기
      <div class="buy_input flex">
        <label for="countId">구매 수량: </label>
        <input placeholder="구매 수량을 입력해주세요" class="flex" type="text" id="countId" name="count">
      </div>
    </div>
    <div class="text flex" id="result">
      총 금액: 0원 (1장당 1,000원)
    </div>
    <button id="buyLotto" class="font flex">구매하기</button>
  </div>
  <button id="reset" class="reset">초기화</button>
  <script src="./JS/app.js" type="module"></script>
</body>
</html>

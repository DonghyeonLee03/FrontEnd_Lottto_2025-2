<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비기너 로또</title>
  <style>
    html{
      width: 2330px;
      height: 1332px;
      background-color: #BABABA;
    }
    body{
      position: relative;
      width: 1440px;
      height: 1000px;
      top: 166px;
      left: 118px;
      background-color: #ffffff;
    }
    body .Header{
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
      padding-left: 70px;
      padding-bottom: 24px;
      padding-right: 70px;
      padding-top: 24px;
      width: 1440px;
      height: 64px;      
      background-color: #4B89DC;
    }
    .Header .text{
      width: 117px;
      height: 28px;
      font-weight: 700;
      font-size: 24px;
      font-family: "Roboto";
      color: #ffffff;
    }
    .lotto{
      width: 571px;
      height: 516px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
      border-radius: 10px;
      background-color: #ffffff;
    }
    .abs{
      position: absolute;
      top: 96px;
      left: 434px;
    }
    .lotto .title{
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      width: 571px;
      height: 100px;
      padding-left: 182px;
      padding-bottom: 22px;
      padding-right: 182px;
      padding-top: 22px;
      border-radius: 10px 10px 0 0;
      gap: 9px;
      background-color: #4B89DC;
    }
    .lotto h1{
      width: 167px;
      height: 28px;
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      font-family: "Roboto";
      color: #ffffff;
    }
    .lotto h2{
      width: 189px;
      height: 19px;
      margin: 0;
      font-size: 16px;
      font-weight: 400;
      font-family: "Roboto";
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="Header">
    <div class="text">
      비기너 로또
    </div>
  </div>
  <div class="lotto abs">
    <div class="title">
      <h1>로또 번호 생성기</h1>
      <h2>행운의 번호를 생성해보세요!</h2>
    </div>
  </div>
</body>
</html>
